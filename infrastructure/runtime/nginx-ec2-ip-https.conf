# REVIEWED CANDIDATE ONLY: install after trusted certificate issuance succeeds.
# Existing Ubuntu host; separate from the Amazon Linux/PostgreSQL template.
server {
    listen 80;
    server_name 3.133.115.154;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://3.133.115.154$request_uri; }
}

server {
    listen 443 ssl;
    server_name 3.133.115.154;
    ssl_certificate /etc/letsencrypt/live/3.133.115.154/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.133.115.154/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/campusshift;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Start with a short HSTS period; extend only after renewal is proven.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { try_files $uri $uri/ /index.html; }
}
