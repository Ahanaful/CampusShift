# Installed only after a publicly trusted certificate is delivered out-of-band.
# No port 80 listener and no public port 8000.
server {
    listen 443 ssl;
    server_name __API_DOMAIN__;
    ssl_certificate /etc/campusshift/tls/fullchain.pem;
    ssl_certificate_key /etc/campusshift/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 128k;
    access_log off;
    error_log /var/log/nginx/campusshift-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
